<!-- ResearchTabs の popup(§9.6)。選び方・対象の一覧・除いた物・警告・プレビュー・話題とファイル名・ボタン・結果。 -->
<!-- 中身は popup.js が textContent で入れる(INV-5)。 -->
<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<title>ResearchTabs</title>
		<link rel="stylesheet" href="popup.css" />
		<script type="module" src="popup.js"></script>
	</head>
	<body>
		<fieldset id="modes">
			<legend>対象</legend>
			<label><input type="radio" name="mode" value="window" /> このウィンドウ <span id="count-window"></span></label>
			<label><input type="radio" name="mode" value="selected" /> 選んだタブ <span id="count-selected"></span> <small id="why-selected"></small></label>
			<label><input type="radio" name="mode" value="group" /> このグループ <span id="count-group"></span> <small id="why-group"></small></label>
		</fieldset>

		<ul id="targets"></ul>
		<p id="unchecked" class="note"></p>

		<details id="excluded">
			<summary id="excluded-summary"></summary>
			<div id="excluded-list"></div>
		</details>
		<p id="empty" class="warn" hidden>対象がありません</p>
		<p id="warning" class="warn"></p>

		<pre id="preview"></pre>

		<div class="names">
			<label>話題 <input id="topic" type="text" /></label>
			<small id="topic-error" class="error"></small>
			<label>ファイル名 <input id="file-name" type="text" /></label>
			<small id="file-name-error" class="error"></small>
		</div>

		<div class="buttons">
			<button id="copy" type="button">コピー</button>
			<button id="obsidian" type="button">Obsidian に新しいノート</button>
			<button id="open-options" type="button" hidden>設定を開く(vault 名か置き場所が空)</button>
		</div>
		<p class="note">話題フォルダが無いときは、先に Obsidian で作ってください。</p>
		<p id="result" role="status"></p>
	</body>
</html>
